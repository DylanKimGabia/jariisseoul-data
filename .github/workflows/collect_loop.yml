name: "자동 수집 루프 (주차장 5분, 도시데이터 10분)"

# 작업 하나가 약 5시간 40분 동안 켜진 채로 직접 5분마다 수집하고,
# 끝나면 자기 자신을 다시 실행한다. GitHub 예약 실행의 지연·누락에 기대지 않기 위함.
# 아래 schedule은 혹시 루프가 끊겼을 때 다시 깨우는 보조 장치.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 */2 * * *"

permissions:
  contents: write
  actions: write   # 끝날 때 자기 자신을 다시 실행하기 위해 필요

concurrency:
  group: collect-loop     # 항상 하나만 실행. 대기 중인 실행은 앞 실행이 끝나면 이어서 시작
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Collect loop
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: bash scripts/run_collect_loop.sh

      - name: Restart myself
        if: ${{ !cancelled() }}   # 직접 취소하면 멈춤
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect_loop.yml --ref main
