name: "주차장 좌표 정리 (1회용)"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Build
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python scripts/build_parking_coords_once.py

      - name: Commit
        run: |
          git config user.name  "parking-bot"
          git config user.email "parking-bot@users.noreply.github.com"
          git add data/reference
          git diff --cached --quiet && exit 0
          git commit -m "reference: parking lot coordinates"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
