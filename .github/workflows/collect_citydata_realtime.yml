name: "도시데이터 실시간 수집 (수동 1회)"

on:
  workflow_dispatch:   # 수동 실행 전용. 자동 수집은 collect_loop.yml이 담당

permissions:
  contents: write

concurrency:
  group: collect-citydata
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Collect
        id: collect
        continue-on-error: true   # 실패해도 기록은 커밋하고, 마지막에 실패로 표시
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python scripts/collect_citydata_realtime.py

      - name: Commit
        run: |
          git config user.name  "parking-bot"
          git config user.email "parking-bot@users.noreply.github.com"
          git add data/citydata
          git diff --cached --quiet && exit 0
          git commit -m "citydata: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Mark failure (GitHub 실패 알림 메일 발송용)
        if: steps.collect.outcome == 'failure'
        run: |
          echo "수집 실패. data/citydata/log.csv 마지막 줄을 확인하세요."
          tail -3 data/citydata/log.csv || true
          exit 1
