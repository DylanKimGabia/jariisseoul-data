name: collect-parking

on:
  schedule:
    - cron: "*/5 * * * *"   # 10분마다 (GitHub 사정으로 몇 분씩 밀릴 수 있음)
  workflow_dispatch:          # Actions 탭에서 수동 실행용

permissions:
  contents: write

concurrency:
  group: collect-parking
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Collect
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python collect.py || echo "collect failed (기록은 data/log.csv)"

      - name: Commit
        run: |
          git config user.name  "parking-bot"
          git config user.email "parking-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
