# 자리있서울 빈자리 예측 설정
# 코드에 숫자를 박지 않고 여기서만 바꾼다. 값마다 이유를 적었다.

data:
  # 수집 데이터 위치. 로컬 폴더가 없으면 GitHub 저장소 zip을 받아 data_cache에 푼다.
  data_dir: ../data
  github_zip: https://github.com/DylanKimGabia/jariisseoul-data/archive/refs/heads/main.zip
  data_cache: .cache/jariisseoul_data

preprocess:
  step_min: 5                 # 시계열 간격(분). 수집 주기와 같다.
  interp_limit: 3             # 15분(3칸) 이하 결측만 선형 보간. 더 긴 공백은 비워 둔다.
  min_cap: 20                 # 20면 미만 제외: 차 1대에 점유율이 5%p 이상 움직여 불안정
  stuck_daily_range: 0.03     # 하루 변동폭 중앙값 3%p 미만이면 센서 멈춤
  min_unique_values: 4        # 서로 다른 값이 3개 이하면 센서 이상 (예: 6대와 20대만 오감)
  holidays: ["2026-12-25"]    # API에 공휴일 정보가 없어 직접 입력. 주말과 같게 취급

split:
  # 끝에서부터 평가(test) → 검증(val) → 나머지 학습(train). 자정 단위로 자른다.
  # 검증 기간에 주말이 들어가도록 4일씩 잡았다. 데이터가 늘면 학습 기간만 길어진다.
  test_days: 4
  val_days: 4
  # 기간 경계에서 정답(미래 값)이 다음 기간으로 넘어가지 않도록 최대 예측 거리만큼 비운다.
  gap_steps: 24

target:
  # 예측 거리(5분 칸). 한 모델이 거리를 입력으로 받아 5분~2시간 뒤를 모두 예측한다.
  horizons: [1, 3, 6, 9, 12, 15, 18, 24]
  max_horizon_steps: 24       # 2시간. EDA에서 오차 자기상관이 약 4시간 뒤 사라짐 → 2시간까지는 최근 흐름이 유효
  free_threshold: 3           # "자리 있음" 기준: 빈자리 3대 이상

model:
  # 사용할 엔진 (jariml/engines). 엔진을 바꿔도 평가 방식, 저장 형식, 예측 API는 같다.
  engine: gbm
  # 아래는 gbm 엔진 설정: sklearn HistGradientBoosting 기본값 수준. 추가 설치 없이 결측값을 그대로 처리한다.
  max_iter: 400
  learning_rate: 0.05
  max_leaf_nodes: 31
  min_samples_leaf: 100
  l2_regularization: 1.0
  random_state: 42

probability:
  # 검증 기간 오차 분포로 확률을 계산한다. 예측 거리와 예측 점유율 구간별로 따로 모은다.
  horizon_bins: [6, 12, 24]                 # ~30분 / ~1시간 / ~2시간
  occ_bins: [0.5, 0.8, 0.9, 1.01]           # 예측 점유율 구간 (만차 근처일수록 오차 분포가 다름)

confidence:
  # 주차장별 검증 기간 1시간 뒤 오차(대수) 기준 신뢰도 표시
  high_max_mae: 3
  mid_max_mae: 6

registry:
  dir: models                 # models/<버전>/ 에 저장, models/LATEST 에 운영 버전 이름
  promote_metric: test_mae_free_1h   # 이 값이 더 작을 때만 운영 모델로 교체
