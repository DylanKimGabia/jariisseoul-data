<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자리있서울 음성 검색</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c1f24; --sub:#6b7280; --line:#e5e7eb; --brand:#1565c0;
          --hi:#2e7d32; --mid:#ef6c00; --lo:#c62828; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
  main { max-width:960px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .lead { color:var(--sub); margin:0 0 20px; font-size:14px; }
  .bar { display:flex; gap:10px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px; }
  #mic { flex:none; width:56px; height:56px; border-radius:50%; border:0; background:var(--brand); color:#fff; font-size:24px; cursor:pointer; }
  #mic.on { background:var(--lo); animation:pulse 1s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 10px rgba(198,40,40,.15); } }
  #q { flex:1; min-width:0; border:0; font-size:16px; padding:8px; outline:none; background:transparent; }
  .btn { flex:none; border:1px solid var(--line); background:#fff; border-radius:10px; padding:10px 14px; font-size:14px; cursor:pointer; }
  #status { color:var(--sub); font-size:14px; margin:10px 2px 18px; min-height:20px; }
  .meta { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; font-size:14px; line-height:1.7; margin-bottom:14px; }
  .note { color:var(--mid); }
  .cards { display:grid; gap:10px; margin-bottom:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; display:grid;
          grid-template-columns:36px 1fr auto; gap:4px 12px; align-items:center; }
  .rank { grid-row:span 2; width:32px; height:32px; border-radius:50%; color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .name { font-weight:700; font-size:15px; }
  .pnr { white-space:nowrap; font-size:12px; color:var(--brand); border:1px solid var(--brand); border-radius:6px; padding:0 5px; margin-left:6px; }
  .prob { font-weight:700; font-size:18px; text-align:right; }
  .detail { color:var(--sub); font-size:13px; }
  .grade { font-size:12px; text-align:right; }
  iframe { width:100%; height:520px; border:1px solid var(--line); border-radius:14px; background:#fff; }
  .hint { color:var(--sub); font-size:13px; margin-top:8px; }
  @media (max-width:560px) { .card { grid-template-columns:32px 1fr auto; } iframe { height:420px; } }
</style>
</head>
<body>
<main>
  <h1>자리있서울 음성 검색</h1>
  <p class="lead">마이크를 누르고 말하세요. 예: "수원 SK스카이뷰에서 교대역까지 내일 아침 8시", "강남역 근처 주차할 곳 알려줘"</p>

  <div class="bar">
    <button id="mic" title="말하기">&#127908;</button>
    <input id="q" placeholder="말한 내용이 여기에 나와요. 직접 입력해도 돼요.">
    <button class="btn" id="go">검색</button>
  </div>
  <div id="status"></div>

  <div id="out"></div>
  <p class="hint">출발지를 말하지 않으면 현재 위치에서 출발해요 (위치 권한 필요). "8시까지 가야 돼"처럼 말하면 도착 목표 시각으로 보고 출발 시각을 계산해요.</p>
</main>
<script>
const $ = (id) => document.getElementById(id);
const COLOR = { "높음": "var(--hi)", "보통": "var(--mid)", "낮음": "var(--lo)" };
let here = null;

navigator.geolocation && navigator.geolocation.getCurrentPosition(
  (p) => { here = { lat: p.coords.latitude, lon: p.coords.longitude }; }, () => {}, { timeout: 8000 });

// 음성 인식 (STT): 브라우저 내장 Web Speech API, 한국어
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (SR) {
  rec = new SR();
  rec.lang = "ko-KR"; rec.interimResults = true; rec.maxAlternatives = 1;
  rec.onstart = () => { $("mic").classList.add("on"); status("듣는 중이에요..."); };
  rec.onresult = (e) => {
    const r = e.results[e.results.length - 1];
    $("q").value = r[0].transcript;
    if (r.isFinal) { rec.stop(); search(); }
  };
  rec.onerror = (e) => status(e.error === "not-allowed" ? "마이크 권한을 허용해 주세요." : "음성 인식 오류: " + e.error);
  rec.onend = () => $("mic").classList.remove("on");
} else {
  status("이 브라우저는 음성 인식을 지원하지 않아요. 크롬이나 엣지에서 열거나, 직접 입력해 주세요.");
}
$("mic").onclick = () => { if (!rec) return; $("mic").classList.contains("on") ? rec.stop() : rec.start(); };
$("go").onclick = search;
$("q").onkeydown = (e) => { if (e.key === "Enter") search(); };

function status(t) { $("status").textContent = t; }

async function search() {
  const text = $("q").value.trim();
  if (!text) return;
  status("추천을 찾는 중이에요...");
  const p = new URLSearchParams({ text });
  if (here) { p.set("lat", here.lat); p.set("lon", here.lon); }
  try {
    const res = await fetch("/voice?" + p);
    const j = await res.json();
    if (!res.ok) { status(j.detail || "오류가 났어요."); return; }
    render(j);
    status("완료 (" + j.meta.elapsed_s + "초)");
  } catch (e) { status("서버에 연결하지 못했어요: " + e); }
}

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function hm(iso) { return iso ? iso.slice(11, 16) : ""; }

function render(j) {
  const m = j.meta, q = j.query;
  let h = `<div class="meta"><b>${esc(m.origin.name)}</b> → <b>${esc(m.dest.name)}</b><br>
    ${m.arrive_by ? "도착 목표 " + hm(m.arrive_by) + " → 권장 출발 " : "출발 "}${hm(m.depart)} / 운전 ${Math.round(m.car.time_s / 60)}분, ${(m.car.dist_m / 1000).toFixed(1)}km (${esc(m.car.source)})<br>
    예측 기준 기록 ${hm(m.data_time)} / 빈자리 ${m.free_threshold}대 이상일 확률 기준`;
  if (m.note) h += `<br><span class="note">${esc(m.note)}</span>`;
  h += `</div><div class="cards">`;
  for (const x of j.results) {
    h += `<div class="card">
      <div class="rank" style="background:${COLOR[x.grade]}">${x.rank}</div>
      <div class="name">${esc(x.name)}${x.is_pnr ? '<span class="pnr">환승</span>' : ""}</div>
      <div class="prob" style="color:${COLOR[x.grade]}">${Math.round(x.prob)}%</div>
      <div class="detail">빈자리 예상 ${Math.round(x.pred_free)}대 (지금 ${Math.round(x.now_free)}대) / 도착 ${hm(x.arrival)} /
        ${esc(x.last_leg)} ${Math.round(x.last_min)}분 / 총 ${Math.round(x.total_min)}분${x.fee != null ? " / 약 " + x.fee.toLocaleString() + "원" : ""}</div>
      <div class="grade" style="color:${COLOR[x.grade]}">${x.grade}</div>
    </div>`;
  }
  h += `</div>`;
  $("out").innerHTML = h;
  if (j.map_html) {
    const f = document.createElement("iframe");
    f.srcdoc = j.map_html;
    $("out").appendChild(f);
  }
}
</script>
</body>
</html>
